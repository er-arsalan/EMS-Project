<!DOCTYPE html>
<html>
<head>
    <title>Even and Odd Numbers</title>
</head>
<body>
    <h2>Even and Odd Numbers from 1 to 100</h2>

    <h3>Even Numbers:</h3>
    <script>
        for (let i = 1; i <= 100; i++) {
            if (i % 2 == 0) {
                document.write(i + " ");
            }
        }
    </script>

    <h3>Odd Numbers:</h3>
    <script>
        for (let i = 1; i <= 100; i++) {
            if (i % 2 != 0) {
                document.write(i + " ");
            }
        }
    </script>
</body>
</html>
