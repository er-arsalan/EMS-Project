<!DOCTYPE html>
<html>
<head>
    <title>Day of the Week</title>
</head>
<body>
    <h2>Find Day of the Week</h2>

    <input type="number" id="day" placeholder="Enter 1 to 7">
    <button onclick="checkDay()">Check</button>

    <p id="result"></p>

    <script>
        function checkDay() {
            let day = document.getElementById("day").value;
            let days = ["Sunday", "Monday", "Tuesday",
                        "Wednesday", "Thursday", "Friday", "Saturday"];

            if (day === "" || day < 1 || day > 7 || !Number.isInteger(Number(day))) {
                document.getElementById("result").innerHTML = "Enter a number from 1 to 7";
            } else {
                document.getElementById("result").innerHTML = days[Number(day) - 1];
            }
        }
    </script>
</body>
</html>
