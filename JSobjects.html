<!DOCTYPE html>
<html>
    <body>
        <h1>JavaScript Objects</h1>
        <h2>Using an Object Literal</h2>
        <p id = "Haroon"></p>
        <script>
            const person = {
                firstName: "Haroon",
                lastName: "Dar",
                Age: 21,
                Eyecolor: "black",
            };
            document.getElementById("Haroon").innerHTML =person.firstName + " is " + person.Age + " years old.";
        </script>
        </body>
        </html>
