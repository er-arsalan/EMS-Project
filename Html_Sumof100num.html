<!DOCTYPE html>
<html>
<head>
    <title>Sum of First 100 Numbers</title>
</head>
<body>
    <h2>Sum of First 100 Numbers</h2>

    <p id="result"></p>

    <script>
        let sum = 0;

        for (let i = 1; i <= 100; i++) {
            sum = sum + i;
        }

        document.getElementById("result").innerHTML =
            "Sum = " + sum;
    </script>
</body>
</html>
