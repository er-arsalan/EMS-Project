<!DOCTYPE html>
<html>
<head>
    <title>Minimum Value in Array</title>
</head>
<body>

    <h2>Find Minimum Value</h2>
    <input type="text" id="numbers" placeholder="Enter numbers separated by commas">
    <button onclick="displayMin()">Display Minimum</button>

    <script>
        function displayMin() {
            let arr = document.getElementById("numbers").value.split(',').map(Number);
            let min = arr[0];

        for (let i = 1; i < arr.length; i++) {
            if (arr[i] < min) {
                min = arr[i];
            }
        }

            document.write("Array Elements: " + arr + "<br>");
            document.write("Minimum Value: " + min);
        }
    </script>

</body>
</html>
